name: novel_editor
description: "NovelEditor - 跨平台小说编辑器 MVP（Windows / Android / iOS）"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  path_provider: ^2.1.4
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.3
  intl: ^0.20.1
  archive: ^4.0.2
  xml: ^6.5.0
  http: ^1.2.2
  crypto: ^3.0.6
  file_picker: ^10.1.2
  flutter_quill: ^11.5.1
  dart_quill_delta: ^10.8.3
  window_manager: ^0.5.2
  pixelarticons: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # objective_c 9.6.1 的 build hook 引用了 code_assets 2.0.0 中不存在的
  # Architecture.arm64e，导致 Windows 构建失败，回退到 9.6.0 待上游修复
  objective_c: 9.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/avatars/